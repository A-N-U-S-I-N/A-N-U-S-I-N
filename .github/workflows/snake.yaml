name: Generate Snake
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # Daily
  push:
    branches: [main]
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for push
    steps:
      - uses: actions/checkout@v4  # This was missing!
      - name: Generate snake
        uses: Platane/snk/svg-only@v3  # Faster SVG-only version
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.2  # Updated version
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
